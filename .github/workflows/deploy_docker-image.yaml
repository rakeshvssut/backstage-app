name: Build and push Docker image

on:
  release:
    types: [published]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18.x
          registry-url: https://registry.npmjs.org/

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Build App
        run: |
          yarn tsc
          yarn build:backend

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v3
        with:
          context: .
          file: ./packages/backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/backstage-app:latest
            ghcr.io/${{ github.repository_owner }}/backstage-app:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/backstage-app:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.description=Docker image for ${{ github.repository_owner }} backstage site

  deploy:
    needs: build
    runs-on: [self-hosted] # This runs on your EC2 self-hosted runner
    steps:
      - name: Run docker-compose to restart backstage
        run: |
          cd ~/backstage-docker
          docker compose down
          docker compose pull
          docker compose up -d
